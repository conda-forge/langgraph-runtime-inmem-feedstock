# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: 0.35.0
  python_min: '3.11'

package:
  name: langgraph-runtime-inmem
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/langgraph-runtime-inmem/langgraph_runtime_inmem-${{ version }}.tar.gz
  sha256: 40d66a418415017cbcef521e83b4a63bcc6221edcc175a58b98aa4d249042f52

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - croniter >=1.0.1
    - langgraph-checkpoint >=3,<5
    - langgraph >=0.4.10,<2
    - sse-starlette >=2
    - starlette >=1.3.1
    - structlog >23
    - blockbuster >=1.5.24,<2.0.0
tests:
  - python:
      imports:
        - langgraph_runtime_inmem
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  homepage: https://pypi.org/project/langgraph-runtime-inmem/
  license: Elastic-2.0
  license_file: LICENSE
  summary: Inmem implementation for the LangGraph API server.
  description: |
    Inmem implementation for the LangGraph API server.

extra:
  recipe-maintainers:
    - rxm7706
